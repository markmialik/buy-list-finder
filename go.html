<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening...</title>
<style>
  body { font: 18px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; }
  a.btn { display: inline-block; margin-top: 12px; padding: 16px 20px; border-radius: 12px;
          background: #0a5bd3; color: #fff; text-decoration: none; font-weight: 600; }
  #err { color: #b00020; }
  code { font-size: 13px; word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<p id="msg">Opening...</p>
<p id="err" hidden></p>
<p><a id="open" class="btn" href="#" hidden>Tap here if nothing happens</a></p>
<p><code id="shown"></code></p>

<script>
(function () {
  // Only these hosts, only https. Anything else is rejected (no open redirect).
  var ALLOWED_HOSTS = ['www.ebay.com', 'ebay.com', 'm.ebay.com',
                       'www.facebook.com', 'facebook.com', 'm.facebook.com'];

  function check(raw) {
    if (!raw) { return { ok: false, why: 'No link given.' }; }
    var url;
    try { url = new URL(raw); } catch (e) { return { ok: false, why: 'Not a valid URL.' }; }
    if (url.protocol !== 'https:') { return { ok: false, why: 'Only https links are allowed.' }; }
    if (url.username || url.password || url.port) { return { ok: false, why: 'Links with credentials or a port are not allowed.' }; }
    if (ALLOWED_HOSTS.indexOf(url.hostname) === -1) { return { ok: false, why: 'Only eBay and Facebook links are allowed.' }; }
    return { ok: true, href: url.href };
  }

  var raw = new URLSearchParams(location.search).get('u');
  var res = check(raw);
  var msg = document.getElementById('msg');
  var err = document.getElementById('err');
  var open = document.getElementById('open');
  var shown = document.getElementById('shown');

  if (res.ok) {
    open.href = res.href;
    open.hidden = false;
    shown.textContent = res.href;
    document.title = 'Opening...';
    location.replace(res.href);
  } else {
    msg.hidden = true;
    document.title = 'Blocked';
    err.textContent = 'Blocked: ' + res.why;
    err.hidden = false;
    if (raw) { shown.textContent = raw; }   // plain text only, never a link
  }
})();
</script>
</body>
</html>
